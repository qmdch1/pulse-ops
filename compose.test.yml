name: pulse-ops-test
services:
  demo-api:
    build: ./monitoring/demo
    environment:
      DATABASE_URL: postgresql://pulse_test:pulse_test_only@postgres:5432/pulse_test
      REDIS_URL: redis://redis:6379/0
    deploy:
      replicas: 3
      resources:
        limits: {cpus: '0.5', memory: 192M}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8080/health")']
      interval: 15s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:17.5-alpine
    environment: {POSTGRES_USER: pulse_test, POSTGRES_PASSWORD: pulse_test_only, POSTGRES_DB: pulse_test}
    volumes: [test-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U pulse_test]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
  redis:
    image: redis:7.4.4-alpine
    command: [redis-server, --maxmemory, 64mb, --maxmemory-policy, allkeys-lru]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
  frontend:
    image: nginx:1.28.0-alpine
    volumes: [./monitoring/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: ['127.0.0.1:18480:8080']
    depends_on: [demo-api]
    mem_limit: 64m
  load-generator:
    image: python:3.12.10-slim
    command: [python, /app/load.py]
    volumes: [./monitoring/demo/load.py:/app/load.py:ro]
    depends_on: [frontend]
    mem_limit: 64m
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://pulse_test:pulse_test_only@postgres:5432/pulse_test?sslmode=disable
    depends_on: [postgres]
    mem_limit: 64m
  redis-exporter:
    image: oliver006/redis_exporter:v1.73.0
    environment: {REDIS_ADDR: 'redis://redis:6379'}
    depends_on: [redis]
    mem_limit: 64m
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    command: ['--nginx.scrape-uri=http://frontend:8080/stub_status']
    depends_on: [frontend]
    mem_limit: 48m
  prometheus:
    image: prom/prometheus:v3.4.1
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=35d, --storage.tsdb.retention.size=1GB]
    volumes:
      - ./monitoring/prometheus/prometheus.test.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - test-prometheus:/prometheus
    ports: ['127.0.0.1:19090:9090']
    mem_limit: 384m
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes: [./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro, test-alertmanager:/alertmanager]
    mem_limit: 64m
  blackbox:
    image: prom/blackbox-exporter:v0.26.0
    volumes: [./monitoring/prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro]
    mem_limit: 64m
  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_USER: pulse
      GF_SECURITY_ADMIN_PASSWORD: pulse_test_only
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports: ['127.0.0.1:13001:3000']
    volumes:
      - test-grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 256m
  dashboard:
    build: .
    profiles: [dashboard]
    environment:
      MONITORING_MODE: test
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_PUBLIC_URL: http://localhost:13001
      SSH_INVENTORY_FILE: /app/config/ssh-inventory.json
    volumes: [./.local/ssh-inventory.json:/app/config/ssh-inventory.json:ro]
    ports: ['127.0.0.1:13000:3000']
    mem_limit: 384m
    depends_on: [prometheus]
volumes:
  test-postgres:
  test-prometheus:
  test-alertmanager:
  test-grafana:
