name: pulse-ops-production
services:
  gateway:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:${DASHBOARD_PORT:-13000}:8080']
    volumes: [./monitoring/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [dashboard, control-plane]
    mem_limit: 64m
  dashboard:
    build: .
    image: pulse-ops:2.0.0
    restart: unless-stopped
    init: true
    environment:
      MONITORING_MODE: production
      CONTROL_PLANE_URL: http://control-plane:7080
      CONTROL_API_TOKEN: ${CONTROL_API_TOKEN:?Set a random service token of at least 32 characters}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:?Set an operator username}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set a unique password of at least 24 characters}
    depends_on: [control-plane]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  control-plane:
    build: ./control-plane
    image: pulse-ops-control:2.0.0
    restart: unless-stopped
    environment:
      MONITORING_MODE: production
      CONTROL_API_TOKEN: ${CONTROL_API_TOKEN:?Set a random service token}
      CONTROL_MASTER_KEY: ${CONTROL_MASTER_KEY:?Set a base64 encoded 32-byte encryption key}
      CONTROL_ALLOWED_ORIGINS: ${DASHBOARD_ORIGIN:?Set the exact dashboard origin}
    volumes: [registry:/data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 384m
    cpus: 1
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  registry:
