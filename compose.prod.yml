name: pulse-ops-production
services:
  control-plane:
    build: ./control-plane
    image: pulse-ops:3.0.0
    restart: unless-stopped
    ports: ['127.0.0.1:${DASHBOARD_PORT:-13000}:7080']
    environment:
      MONITORING_MODE: production
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:?Set an operator username}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set a unique password of at least 24 characters}
      CONTROL_MASTER_KEY: ${CONTROL_MASTER_KEY:?Set a base64 encoded 32-byte encryption key}
      CONTROL_ALLOWED_ORIGINS: ${DASHBOARD_ORIGIN:?Set the exact dashboard origin}
    volumes: [registry:/data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 384m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:7080/api/health']
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  registry:
