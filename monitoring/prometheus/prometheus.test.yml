global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    environment: test
rule_files:
  - /etc/prometheus/rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: application
    dns_sd_configs:
      - names: [backend]
        type: A
        port: 8080
        refresh_interval: 15s
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
  - job_name: frontend
    static_configs:
      - targets: ['nginx-exporter:9113']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://frontend:8080/health']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
