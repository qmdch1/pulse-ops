global:
  resolve_timeout: 5m
route:
  receiver: local-only
  group_by: [alertname, job, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: local-only
inhibit_rules:
  - source_matchers: ['alertname="TargetUnavailable"']
    target_matchers: ['severity="warning"']
    equal: [job, instance]
