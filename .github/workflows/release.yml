name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pulse-ops

jobs:
  image:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=PULSE / OPS

      - uses: docker/build-push-action@v6
        with:
          context: ./control-plane
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum

      - name: Test
        working-directory: control-plane
        run: |
          go vet ./...
          go test ./...

      - name: Build archives
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$REF_TYPE" = tag ]; then version="${REF_NAME#v}"; else version="0.0.0-dev.${SHA::7}"; fi
          root="$PWD"
          dist="$root/dist"
          mkdir -p "$dist"
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="pulse-ops_${version}_${goos}_${goarch}"
            stage="$root/build/$name"
            mkdir -p "$stage"
            exe=pulse-ops
            if [ "$goos" = windows ]; then exe=pulse-ops.exe; fi
            (cd control-plane && CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags='-s -w' -o "$stage/$exe" .)
            cp README.md "$stage/"
            if [ "$goos" = windows ]; then
              (cd "$stage" && zip -q -9 "$dist/$name.zip" "$exe" README.md)
            else
              tar -C "$stage" -czf "$dist/$name.tar.gz" "$exe" README.md
            fi
          done
          (cd "$dist" && sha256sum -- * > SHA256SUMS)
          cat "$dist/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=
            case "$TAG" in *-*) prerelease=--prerelease ;; esac
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag $prerelease
          fi
